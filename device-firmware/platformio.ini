; platformio.ini - Proyecto PlatformIO del firmware CardioAlert (ESP32).
;
; Decisión E0: PlatformIO + framework Arduino + NimBLE (ver docs/integration.md §6).
;
; ESTADO: PREPARADO, NO COMPILABLE TODAVÍA, A PROPÓSITO.
; * No hay ningún [env:...] activo porque la placa no está identificada
;   (hardware_config.h: ECG_HW_MODEL "TBD"). No se inventa un board ID.
; * Nada de esto se ha descargado ni instalado. Las versiones están fijadas
;   pero no se han resuelto contra el registro de PlatformIO: verificarlo en E2.
;
; Para activarlo (E2), cuando se conozca la placa:
;   1. Descomentar el bloque [env:cardioalert] del final y poner su `board`.
;   2. Implementar src/esp32/ (Esp32BleTransport y main_esp32.cpp).
;   3. pio run -d device-firmware
;
; DISCO: core_dir mantiene PlatformIO, toolchains, paquetes y caché dentro del
; proyecto (.tools/platformio, ignorado por git), nunca en C:\Users\...\.platformio.
; Instalar PlatformIO Core también dentro del proyecto (docs/integration.md §6).

[platformio]
core_dir = ../.tools/platformio
src_dir = src
include_dir = include
lib_dir = lib
; .pio/ (salida de compilación) queda dentro de device-firmware/ y está en .gitignore.
build_dir = .pio/build
; Las pruebas de test/host y test/tflm son de PC (g++) y tienen sus propios
; scripts: se aísla `pio test` en una carpeta propia para que no las tome.
test_dir = test/pio

[env]
; Arduino-ESP32 2.0.17 (ESP-IDF 4.4.7). Versión exacta, sin rango.
platform = espressif32 @ 6.9.0
framework = arduino
; NimBLE-Arduino 2.x: notify() devuelve bool, necesario para el contrato
; "notify devuelve false si la cola está llena" (D3). Versión exacta.
lib_deps =
    h2zero/NimBLE-Arduino @ 2.1.0
; Solo las librerías que se incluyan de verdad (evita arrastrar el BLE Bluedroid del core).
lib_ldf_mode = chain
; El firmware es C++17 (como las pruebas host); el core 2.x compila por defecto con gnu++11.
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -DECG_PLATFORMIO=1
; Avisos para el código del proyecto (sin -Werror: las cabeceras del framework avisan).
build_src_flags = -Wall -Wextra
; main.cpp es la demo de PC y, con ARDUINO definido, se detiene con #error a
; propósito: PlatformIO no lo compila. El punto de entrada del ESP32 será
; src/esp32/main_esp32.cpp (E2). inference_tflm.cpp se compila vacío mientras
; no se defina ECG_HAVE_TFLM=1 (E4).
build_src_filter =
    +<*>
    -<main.cpp>
monitor_speed = 115200

; --- Placa: PENDIENTE --------------------------------------------------------
; NO descomentar hasta identificar la placa física. No asignar pines aquí:
; van en include/hardware_config.h cuando el responsable de hardware los confirme.
;
; [env:cardioalert]
; board = <PENDIENTE: p. ej. el ID exacto de la placa recibida>
; ; Solo si la placa tiene PSRAM y se confirma:
; ; build_flags = ${env.build_flags} -DBOARD_HAS_PSRAM
